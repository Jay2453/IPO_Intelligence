version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipo_user
      POSTGRES_PASSWORD: ipo_password
      POSTGRES_DB: ipo_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo_user -d ipo_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
